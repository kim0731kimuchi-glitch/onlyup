<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>どこまで登れる？</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: sans-serif;
            user-select: none;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 5px;
            pointer-events: none;
            font-size: 14px;
            line-height: 1.6;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        #ranking-board {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 13px;
            line-height: 1.5;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            display: none;
        }
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #fff;
            font-size: 24px;
            text-align: center;
            line-height: 1.8;
            z-index: 200;
        }
        #settings-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 25, 0.95);
            border: 2px solid #87CEEB;
            padding: 25px 30px;
            border-radius: 10px;
            color: #fff;
            z-index: 300;
            display: none;
            width: 320px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #settings-menu h2 {
            margin-top: 0;
            color: #87CEEB;
            text-align: center;
            font-size: 20px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        .setting-item {
            margin-bottom: 15px;
        }
        .setting-item label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
        }
        .setting-item input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="info">
        <strong>操作方法:</strong> [W][A][S][D] 移動 | [スペース] ジャンプ (高跳び仕様)<br>
        [TAB] 設定画面 (マウス感度・移動速度)<br>
        <div id="ranking-board">
            <strong>【ランキング】</strong><br>
            1位: <span id="rank-1" style="color: #ffff55;">0m</span><br>
            2位: <span id="rank-2" style="color: #ffaa55;">0m</span><br>
            3位: <span id="rank-3" style="color: #ff5555;">0m</span>
        </div>
        <div style="margin-top: 6px;" id="zone-display">高度: 0m | ビギナー</div>
    </div>
    
    <div id="crosshair"></div>

    <div id="blocker">
        どこまで登れる？<br>
        <span style="font-size:16px; color:#ddd;">クリックしてゲームを開始（TABキーで設定）</span>
    </div>

    <div id="settings-menu">
        <h2>ゲーム設定 (TAB)</h2>
        <div class="setting-item">
            <label>マウス感度: <span id="sens-val">1.00</span></label>
            <input type="range" id="sens-range" min="0.05" max="3.0" step="0.05" value="1.0">
        </div>
        <div class="setting-item">
            <label>足の速さ (移動倍率): <span id="player-speed-val">1.0</span>x</label>
            <input type="range" id="player-speed-range" min="0.5" max="3.0" step="0.1" value="1.0">
        </div>
        <div style="text-align: center; font-size: 11px; color: #aaa; margin-top: 10px;">
            もう一度 [TAB] を押してゲームに戻る
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let camera, scene, renderer;
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let canJump = false;

        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();

        const STAND_HEIGHT = 1.8;
        const platforms = [];

        let currentSensitivity = 1.0;
        let playerSpeedMultiplier = 1.0;
        let isSettingsOpen = false;
        let isLocked = false;

        let currentRunMaxAltitude = 0;
        let rankings = [0, 0, 0];

        const playerGroup = new THREE.Group();
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');

        let accumulatedMovementX = 0;
        let accumulatedMovementY = 0;
        
        let baseImage = null;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.012);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 350);
            camera.position.set(0, STAND_HEIGHT, 0);

            playerGroup.position.set(0, 2.5, 0);
            playerGroup.add(camera);
            scene.add(playerGroup);

            // 画像の読み込み
            const imageLoader = new Image();
            imageLoader.src = 'symbol02-1.png';
            imageLoader.onload = () => {
                baseImage = imageLoader;
                generatePlatforms();
            };

            const blocker = document.getElementById('blocker');
            const crosshair = document.getElementById('crosshair');
            const settingsMenu = document.getElementById('settings-menu');

            blocker.addEventListener('click', () => {
                if (!isSettingsOpen) {
                    document.body.requestPointerLock();
                }
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    isLocked = true;
                    if (!isSettingsOpen) {
                        blocker.style.display = 'none';
                        crosshair.style.display = 'block';
                    }
                } else {
                    isLocked = false;
                    if (!isSettingsOpen) {
                        blocker.style.display = 'flex';
                        crosshair.style.display = 'none';
                    }
                }
            });

            document.addEventListener('mousemove', (event) => {
                if (!isLocked || isSettingsOpen) return;

                let movementX = event.movementX || event.mozMovementX || event.webkitMovementX || 0;
                let movementY = event.movementY || event.mozMovementY || event.webkitMovementY || 0;

                if (Math.abs(movementX) > 500) movementX = 0;
                if (Math.abs(movementY) > 500) movementY = 0;

                accumulatedMovementX += movementX;
                accumulatedMovementY += movementY;
            });

            const sensRange = document.getElementById('sens-range');
            const sensVal = document.getElementById('sens-val');
            sensRange.addEventListener('input', (e) => {
                currentSensitivity = parseFloat(e.target.value);
                sensVal.innerText = currentSensitivity.toFixed(2);
            });

            const playerSpeedRange = document.getElementById('player-speed-range');
            const playerSpeedVal = document.getElementById('player-speed-val');
            playerSpeedRange.addEventListener('input', (e) => {
                playerSpeedMultiplier = parseFloat(e.target.value);
                playerSpeedVal.innerText = playerSpeedMultiplier.toFixed(1);
            });

            const onKeyDown = (event) => {
                if (event.code === 'Tab') {
                    event.preventDefault();
                    toggleSettings();
                    return;
                }

                if (isSettingsOpen) return;

                switch (event.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyD': moveRight = true; break;
                    case 'Space':
                        event.preventDefault();
                        if (canJump === true) {
                            velocity.y += 28.0; 
                            canJump = false;
                        }
                        break;
                }
            };

            const onKeyUp = (event) => {
                if (isSettingsOpen) return;
                switch (event.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(50, 100, 50);
            scene.add(sunLight);

            const groundGeo = new THREE.PlaneGeometry(6000, 6000);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x55a630 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = 0;
            scene.add(ground);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        function generatePlatforms() {
            // 初期スポーン台座 (円柱, 半径5, 高さ1)
            createCylinderPlatform(0, 2.5, 0, 5, 1, 0x111111);

            const clutterColors = [0x8B4513, 0xA0522D, 0xCD853F, 0x696969, 0x4682B4, 0x2E8B57, 0xDAA520, 0xBC8F8F];
            
            let currentX = 0;
            let currentZ = 0;
            let currentY = 5;

            const totalLevels = 800; 
            for (let i = 1; i <= totalLevels; i++) {
                let heightStep = 5.0 + Math.random() * 1.5; 
                currentY += heightStep;

                let distance, radius;
                if (currentY >= 1000) {
                    distance = 11.5 + Math.random() * 3.5;
                    radius = 0.75;
                } else if (currentY >= 800) {
                    distance = 11.0 + Math.random() * 4.0;
                    radius = 1.25;
                } else if (currentY >= 600) {
                    distance = 10.5 + Math.random() * 4.5;
                    radius = 1.8;
                } else if (currentY >= 400) {
                    distance = 10.0 + Math.random() * 5.0;
                    radius = 2.4;
                } else if (currentY >= 200) {
                    distance = 8.5 + Math.random() * 5.0;
                    radius = 3.2;
                } else {
                    distance = 8.0 + Math.random() * 5.0;
                    radius = 4.2;
                }

                const angle = Math.random() * Math.PI * 2;
                currentX += Math.cos(angle) * distance;
                currentZ += Math.sin(angle) * distance;

                currentX = Math.max(-300, Math.min(300, currentX));
                currentZ = Math.max(-300, Math.min(300, currentZ));

                let color = clutterColors[Math.floor(Math.random() * clutterColors.length)];
                createCylinderPlatform(currentX, currentY, currentZ, radius, 0.6, color);
            }
        }

        function toggleSettings() {
            isSettingsOpen = !isSettingsOpen;
            const menu = document.getElementById('settings-menu');
            const crosshair = document.getElementById('crosshair');
            const blocker = document.getElementById('blocker');

            if (isSettingsOpen) {
                document.exitPointerLock();
                menu.style.display = 'block';
                crosshair.style.display = 'none';
                blocker.style.display = 'none';
            } else {
                menu.style.display = 'none';
                document.body.requestPointerLock();
            }
        }

        // 黒色部分を透明（アルファ=0）にくり抜くテクスチャ生成関数
        function createTransparentTexture() {
            if (!baseImage) return null;

            const canvas = document.createElement('canvas');
            canvas.width = baseImage.width;
            canvas.height = baseImage.height;
            const ctx = canvas.getContext('2d');

            ctx.drawImage(baseImage, 0, 0);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                // 黒い部分を判定して透明にする
                if (r < 40 && g < 40 && b < 40) {
                    data[i + 3] = 0; // アルファを0（完全透明）に
                }
            }

            ctx.putImageData(imgData, 0, 0);

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        function createCylinderPlatform(x, y, z, radius, height, color) {
            // 側面の素材（ランダムカラー）
            const sideMaterial = new THREE.MeshLambertMaterial({ color: color });
            
            // 上面：黒を透明抜きしたテクスチャ
            const topTexture = createTransparentTexture();
            const topMaterial = topTexture ? new THREE.MeshLambertMaterial({ 
                map: topTexture, 
                transparent: true,
                alphaTest: 0.1
            }) : new THREE.MeshLambertMaterial({ color: color });

            // CylinderGeometry(radiusTop, radiusBottom, height, radialSegments)
            const geometry = new THREE.CylinderGeometry(radius, radius, height, 32);
            
            // [側面マテリアル, 上面マテリアル, 底面マテリアル] の順で割り当て
            const materials = [
                sideMaterial, // 側面
                topMaterial,  // 上面
                sideMaterial  // 底面
            ];

            const mesh = new THREE.Mesh(geometry, materials);
            mesh.position.set(x, y, z);
            scene.add(mesh);

            // 当たり判定用にサイズを保持（円柱なので半径を元に判定）
            platforms.push({
                mesh: mesh,
                x: x, y: y, z: z,
                radius: radius,
                height: height,
                minX: x - radius,
                maxX: x + radius,
                minY: y - height / 2,
                maxY: y + height / 2,
                minZ: z - radius,
                maxZ: z + radius
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateHUD(height, posX, posZ) {
            const h = Math.max(0, Math.floor(height));

            if (h > currentRunMaxAltitude) {
                currentRunMaxAltitude = h;
            }

            document.getElementById('rank-1').innerText = rankings[0] + 'm';
            document.getElementById('rank-2').innerText = rankings[1] + 'm';
            document.getElementById('rank-3').innerText = (rankings[2] || 0) + 'm';

            const display = document.getElementById('zone-display');
            let currentSpan = Math.max(Math.abs(posX), Math.abs(posZ)).toFixed(0);

            let tierName = "ビギナー";
            let color = "#55ff55";

            if (h >= 1000) {
                tierName = "マスター";
                color = "#ff00ff";
            } else if (h >= 800) {
                tierName = "エキスパート";
                color = "#ff33cc";
            } else if (h >= 600) {
                tierName = "ハード";
                color = "#ff3333";
            } else if (h >= 400) {
                tierName = "ノーマル";
                color = "#ff9933";
            } else if (h >= 200) {
                tierName = "イージー";
                color = "#ffff33";
            }

            display.innerHTML = `高度: ${h}m | [ <span style="color:${color};">${tierName}</span> ] | 横幅: ±${currentSpan}m`;
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.033);
            prevTime = time;

            if (isLocked === true && !isSettingsOpen) {
                const movementX = accumulatedMovementX;
                const movementY = accumulatedMovementY;
                accumulatedMovementX = 0;
                accumulatedMovementY = 0;

                if (movementX !== 0 || movementY !== 0) {
                    euler.y -= movementX * 0.002 * currentSensitivity;
                    euler.x -= movementY * 0.002 * currentSensitivity;

                    euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
                    camera.quaternion.setFromEuler(euler);
                }

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 28.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const baseMoveSpeed = 150.0;
                const moveSpeed = baseMoveSpeed * playerSpeedMultiplier;

                if (moveForward || moveBackward) velocity.z -= direction.z * moveSpeed * delta;
                if (moveLeft || moveRight) velocity.x += direction.x * moveSpeed * delta;

                const moveDir = new THREE.Vector3();
                const yawEuler = new THREE.Euler(0, euler.y, 0, 'YXZ');
                
                const forwardVec = new THREE.Vector3(0, 0, -1).applyEuler(yawEuler);
                const rightVec = new THREE.Vector3(1, 0, 0).applyEuler(yawEuler);

                moveDir.addScaledVector(forwardVec, -velocity.z * delta);
                moveDir.addScaledVector(rightVec, velocity.x * delta);

                playerGroup.position.add(moveDir);

                const pPos = playerGroup.position;
                
                const substeps = 8;
                const subDelta = delta / substeps;

                for (let step = 0; step < substeps; step++) {
                    pPos.y += (velocity.y * subDelta);

                    if (pPos.y < 1.0) {
                        if (currentRunMaxAltitude > 0) {
                            rankings.push(currentRunMaxAltitude);
                            rankings.sort((a, b) => b - a);
                            rankings = rankings.slice(0, 3);
                            currentRunMaxAltitude = 0;
                        }

                        pPos.set(0, 2.5, 0);
                        velocity.set(0, 0, 0);
                        canJump = true;
                        break;
                    }

                    let landed = false;
                    for (let plat of platforms) {
                        // 円形の当たり判定（水平距離がプラットフォームの半径以内か）
                        const dx = pPos.x - plat.x;
                        const dz = pPos.z - plat.z;
                        const distSq = dx * dx + dz * dz;

                        if (distSq <= (plat.radius + 0.3) * (plat.radius + 0.3)) {
                            const playerFeetY = pPos.y;
                            if (velocity.y <= 0 && playerFeetY >= plat.maxY - 0.8 && playerFeetY <= plat.maxY + 0.6) {
                                pPos.y = plat.maxY;
                                velocity.y = 0;
                                canJump = true;
                                landed = true;
                                break;
                            }
                        }
                    }
                    if (landed) break;
                }

                for (let plat of platforms) {
                    const dx = plat.x - pPos.x;
                    const dz = plat.z - pPos.z;
                    const horizontalDistSq = dx * dx + dz * dz;
                    const verticalDist = Math.abs(plat.y - pPos.y);

                    if (horizontalDistSq <= 100 * 100 && verticalDist <= 300) {
                        plat.mesh.visible = true;
                    } else {
                        plat.mesh.visible = false;
                    }
                }

                updateHUD(pPos.y, pPos.x, pPos.z);
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
